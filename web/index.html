<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Heimabend-Baukasten</title>
<meta name="description" content="Bausteine für den Heimabend: Spiele, Proben, Aktivitäten und Projekte für Pfadfindergruppen.">
<style>
/* ------------------------------------------------------------------
   Heimabend-Baukasten – Oberfläche
   Mobile zuerst: alles ist auf ein Handy im Gruppenheim ausgelegt.
   Kein Framework, keine Schriftarten von außen, keine Bilder.
   ------------------------------------------------------------------ */
:root {
  --grund: #f6f5f1;
  --karte: #ffffff;
  --text: #21201c;
  --leise: #6b6862;
  --linie: #c9c3b6;
  --akzent: #2f5d3a;          /* Pfadfindergrün */
  --akzent-text: #ffffff;
  --akzent-leicht: #e6efe7;
  --warn: #a8531b;
  --schatten: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.05);
  --rund: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --grund: #16181a;
    --karte: #212427;
    --text: #e9e7e2;
    --leise: #a2a09a;
    --linie: #4d5359;
    --akzent: #7fb98c;
    --akzent-text: #10231a;
    --akzent-leicht: #23332a;
    --warn: #e0a06a;
    --schatten: 0 1px 2px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
/* Ohne diese Regel ist beim Bedienen mit der Tastatur nicht zu erkennen,
   wo man gerade steht – auf dem grünen Knopf war der Standardring kaum sichtbar. */
:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; border-radius: 4px; }
.knopf.stark:focus-visible, .chip.aktiv:focus-visible { outline-color: var(--text); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--grund);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-wrap: break-word;
}
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .4em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------------------------------------------------------- Grundgerüst */
.huelle { max-width: 720px; margin: 0 auto; padding: 0 12px 96px; }

header.kopf {
  position: sticky; top: 0; z-index: 20;
  background: var(--grund);
  border-bottom: 1px solid var(--linie);
  padding-top: env(safe-area-inset-top);
}
.kopf-innen { max-width: 720px; margin: 0 auto; padding: 10px 12px 0; }
.kopf h1 { font-size: 1.15rem; margin: 0 0 8px; letter-spacing: -.01em; }
.kopf h1 span { color: var(--leise); font-weight: 400; font-size: .8rem; display: block; }

.reiter { display: flex; gap: 4px; }
.reiter button {
  flex: 1; padding: 10px 8px; border: 0; border-bottom: 3px solid transparent;
  background: none; color: var(--leise); font-weight: 600; font-size: .95rem;
}
.reiter button[aria-current="page"] { color: var(--text); border-bottom-color: var(--akzent); }
/* Im Querformat fraßen Kopf und Summe zusammen 79 % der Höhe. */
@media (max-height: 560px) {
  .kopf h1 span { display: none; }
  .kopf h1 { font-size: 1rem; }
}

/* ---------------------------------------------------------- Suche/Filter */
.suchzeile { display: flex; gap: 8px; margin: 14px 0 8px; }
.suchzeile input[type="search"] {
  flex: 1; min-width: 0; padding: 11px 12px;
  border: 1px solid var(--linie); border-radius: var(--rund);
  background: var(--karte); -webkit-appearance: none;
}
.knopf {
  padding: 11px 14px; border: 1px solid var(--linie); border-radius: var(--rund);
  background: var(--karte); font-weight: 600; white-space: nowrap;
}
.knopf.stark { background: var(--akzent); color: var(--akzent-text); border-color: var(--akzent); }
.knopf.klein { padding: 11px 13px; min-height: 44px; font-size: .85rem; font-weight: 500; }
.knopf:disabled { opacity: .45; cursor: default; }

details.filter { border: 1px solid var(--linie); border-radius: var(--rund); background: var(--karte); }
details.filter > summary {
  padding: 11px 14px; cursor: pointer; font-weight: 600; list-style: none;
  display: flex; justify-content: space-between; align-items: center;
}
details.filter > summary::-webkit-details-marker { display: none; }
details.filter > summary::after { content: "▾"; color: var(--leise); }
details.filter[open] > summary::after { content: "▴"; }
.filter-raster {
  padding: 0 14px 14px;
  display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px;
}
@media (max-width: 400px) { .filter-raster { grid-template-columns: 1fr; } }
.feld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.feld label { font-size: .75rem; color: var(--leise); font-weight: 600;
  text-transform: uppercase; letter-spacing: .03em; }
.feld select {
  padding: 9px 10px; min-height: 44px; font-size: 16px;
  border: 1px solid var(--linie); border-radius: 8px;
  background: var(--grund); width: 100%;
}
.schalter { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; min-height: 44px; }
.schalter input { width: 24px; height: 24px; flex: none; accent-color: var(--akzent); }
.schalter label { text-transform: none; font-size: .9rem; color: var(--text);
  font-weight: 400; letter-spacing: 0; padding: 11px 0; }
.filter-fuss { grid-column: 1 / -1; display: flex; justify-content: flex-end; }

/* ------------------------------------------------------------ Brotkrumen */
.pfad { display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
  margin: 12px 2px 10px; font-size: .85rem; }
.pfad button { background: none; border: 0; padding: 10px 8px; min-height: 44px;
  color: var(--akzent); font-weight: 600; font-size: .85rem; }
.pfad .jetzt { color: var(--leise); font-weight: 600; padding: 10px 8px; }
.pfad .pfeil { color: var(--leise); }

/* --------------------------------------------------------------- Kacheln */
.kacheln { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
@media (min-width: 560px) { .kacheln { grid-template-columns: 1fr 1fr 1fr; } }
.kachel {
  text-align: left; background: var(--karte); border: 1px solid var(--linie);
  border-radius: var(--rund); padding: 14px; box-shadow: var(--schatten);
  display: flex; flex-direction: column; gap: 2px; min-height: 76px;
  justify-content: center;
}
.kachel:active { transform: scale(.99); }
.kachel .name { font-weight: 600; font-size: .98rem; }
.kachel .zahl { font-size: .8rem; color: var(--leise); }
.kachel.gross { grid-column: 1 / -1; flex-direction: row; align-items: center;
  justify-content: space-between; min-height: 0; padding: 12px 14px; }
.kachel.gross .name { font-size: .92rem; color: var(--akzent); }

/* ---------------------------------------------------------- Trefferzeile */
.trefferzeile {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  margin: 14px 2px 8px; font-size: .85rem; color: var(--leise);
}
.trefferzeile select {
  border: 1px solid var(--linie); border-radius: 8px; background: var(--karte);
  padding: 6px 8px; min-height: 44px; font-size: 16px; color: var(--text);
}

/* ---------------------------------------------------------------- Karten */
.liste { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
.karte {
  width: 100%; text-align: left;
  background: var(--karte); border: 1px solid var(--linie); border-radius: var(--rund);
  padding: 12px 14px; box-shadow: var(--schatten);
}
.karte:active { transform: scale(.995); }
.karte h3 { font-size: 1rem; margin: 0 0 3px; }
.karte p { margin: 0; font-size: .875rem; color: var(--leise);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.merkmale { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.merkmal {
  font-size: .72rem; padding: 2px 7px; border-radius: 999px;
  border: 1px solid var(--linie); color: var(--leise);
  white-space: normal; max-width: 100%;
}
.merkmal.typ { background: var(--akzent-leicht); border-color: transparent;
  color: var(--akzent); font-weight: 600; }
.merkmal.zeit { background: var(--akzent-leicht); border-color: transparent;
  color: var(--akzent); font-weight: 600; }
.merkmal.offen { border-style: dashed; }
@media (prefers-color-scheme: dark) {
  .merkmal.typ, .merkmal.zeit { color: var(--text); }
}

.leer { text-align: center; color: var(--leise); padding: 36px 20px; }
.leer button { background: none; border: 0; color: var(--akzent); font-weight: 600;
  text-decoration: underline; padding: 11px 4px; min-height: 44px; }
.mehr { margin: 12px 0; display: flex; justify-content: center; }

/* ---------------------------------------------------------- Überlagerung */
.ueberlagerung {
  position: fixed; inset: 0; z-index: 50;
  background: var(--grund);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: env(safe-area-inset-bottom);
}
.ueberlagerung[hidden] { display: none; }
.ueber-kopf {
  position: sticky; top: 0; z-index: 5; background: var(--grund);
  border-bottom: 1px solid var(--linie); padding-top: env(safe-area-inset-top);
  display: flex; align-items: center; gap: 8px; padding-inline: 8px;
}
.ueber-kopf .titel { font-weight: 600; flex: 1; min-width: 0; padding: 12px 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ueber-kopf button { background: none; border: 0; padding: 12px; font-size: 1rem;
  font-weight: 600; color: var(--akzent); }
.ueber-inhalt { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }
.ueber-inhalt h2 { font-size: 1.3rem; }

.datenblatt { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 14px;
  margin: 14px 0; font-size: .9rem; }
.datenblatt dt { color: var(--leise); }
.datenblatt dd { margin: 0; overflow-wrap: anywhere; }

.text h4 { margin: 1.2em 0 .3em; font-size: 1rem; }
.text p { margin: 0 0 .8em; }
.text ul { margin: 0 0 .8em; padding-left: 1.2em; }
.text li { margin-bottom: .25em; }

.kasten { border-radius: var(--rund); padding: 12px 14px; margin: 16px 0; font-size: .9rem; }
.kasten.tipp { background: var(--akzent-leicht); }
.kasten.quelle { border: 1px solid var(--linie); background: var(--karte); color: var(--leise); }
.kasten.quelle a { color: inherit; }
.kasten.dublette { border: 1px dashed var(--linie); background: none; color: var(--leise); }
.kasten h4 { margin: 0 0 6px; font-size: .8rem; text-transform: uppercase;
  letter-spacing: .04em; color: var(--leise); }
.kasten.tipp h4 { color: var(--akzent); }
@media (prefers-color-scheme: dark) { .kasten.tipp h4 { color: var(--text); } }
.kasten.dublette button { background: none; border: 0; padding: 11px 4px; min-height: 44px;
  color: inherit; text-decoration: underline; font-size: inherit; }

/* ------------------------------------------------------------ Chip-Reihen */
.chipzeile { margin: 10px 0; }
.planzeile { margin: 14px 0 4px; }
.planzeile .chiptitel { font-size: .72rem; color: var(--leise); font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; display: block; }
.chipzeile .chiptitel { font-size: .72rem; color: var(--leise); font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 11px 14px; min-height: 44px; border-radius: 999px; border: 1px solid var(--linie);
  background: var(--karte); font-size: .82rem; color: var(--leise);
}
.chip.aktiv { background: var(--akzent); border-color: var(--akzent);
  color: var(--akzent-text); font-weight: 600; }

/* ---------------------------------------------------------------- Planer */
.rahmen {
  background: var(--karte); border: 1px solid var(--linie); border-radius: var(--rund);
  padding: 14px; margin: 14px 0 16px; box-shadow: var(--schatten);
}
.rahmen h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--leise); margin-bottom: 10px; }
.rahmen .filter-raster { padding: 0; }

.slot {
  background: var(--karte); border: 1px solid var(--linie); border-radius: var(--rund);
  padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--schatten);
}
.slot-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slot-name { font-size: .75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; color: var(--leise); }
.slot-dauer { font-size: .8rem; color: var(--leise); white-space: nowrap; }
.slot-inhalt { margin-top: 6px; }
.slot-inhalt .gewaehlt { font-weight: 600; }
.slot-inhalt .kurz { font-size: .85rem; color: var(--leise); margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slot-inhalt .frei { font-size: .85rem; color: var(--leise); margin-top: 2px; }
.slot-knoepfe { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.slot.fest { background: none; box-shadow: none; border-style: dashed; }
/* Der feste Slot lässt sich nicht öffnen – hier darf nichts abgeschnitten werden. */
.slot.fest .kurz { display: block; overflow: visible; }
.slot .quellzeile { font-size: .75rem; color: var(--leise); margin-top: 4px; }

.summe {
  position: sticky; bottom: 0; z-index: 10;
  margin: 16px -12px 0; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  background: var(--karte); border-top: 1px solid var(--linie);
}
.summe-zeile { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.summe-wert { font-size: 1.1rem; font-weight: 700; }
.summe-wert.knapp { color: var(--warn); }
.balken { height: 6px; border-radius: 3px; background: var(--linie); margin: 8px 0 10px;
  overflow: hidden; box-shadow: inset 0 0 0 1px var(--leise); }
.balken i { display: block; height: 100%; background: var(--akzent); transition: width .2s; }
.balken i.knapp { background: var(--warn); }
/* Bei 320 px Breite brauchten die drei Knöpfe nebeneinander 309 von 296 px
   und schoben die ganze Seite waagerecht weg. */
.summe-knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }
.summe-knoepfe .knopf { flex: 1 1 auto; min-width: 0; text-align: center; }
@media (max-width: 359px) { .summe-knoepfe .knopf.stark { flex-basis: 100%; } }

.planausgabe {
  width: 100%; min-height: 200px; margin-top: 12px; padding: 12px;
  border: 1px solid var(--linie); border-radius: var(--rund);
  background: var(--karte); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 16px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
}
.meldung { text-align: center; font-size: .85rem; color: var(--akzent);
  min-height: 1.2em; margin-top: 8px; }

.fuss { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--linie);
  font-size: .78rem; color: var(--leise); }
.fuss p { margin: 0 0 .5em; }
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-innen">
    <h1>Heimabend-Baukasten <span>Bausteine für die Gruppenstunde</span></h1>
    <nav class="reiter" aria-label="Ansicht">
      <button id="reiterBausteine" aria-current="page">Bausteine</button>
      <button id="reiterPlanen">Heimabend planen</button>
    </nav>
  </div>
</header>

<main class="huelle">

  <!-- ============================================== Ansicht: Bausteine -->
  <section id="ansichtBausteine">
    <div class="suchzeile">
      <input type="search" id="suche" placeholder="Suchen …" autocomplete="off"
             aria-label="Bausteine durchsuchen">
      <button class="knopf" id="zufallKnopf">Zufall</button>
    </div>

    <nav class="pfad" id="pfad" aria-label="Wo bin ich"></nav>

    <details class="filter" id="filterBox">
      <summary><span>Filter</span><span id="filterZahl"></span></summary>
      <div class="filter-raster">
        <div class="feld">
          <label for="fStufe">Altersstufe</label>
          <select id="fStufe">
            <option value="">alle</option>
            <option>Wölflinge</option>
            <option>Pfadfinder</option>
            <option>Ältere</option>
          </select>
        </div>
        <div class="feld">
          <label for="fDauer">Dauer</label>
          <select id="fDauer">
            <option value="">egal</option>
            <option value="10">passt in 10 Min</option>
            <option value="15">passt in 15 Min</option>
            <option value="20">passt in 20 Min</option>
            <option value="30">passt in 30 Min</option>
            <option value="45">passt in 45 Min</option>
            <option value="60">passt in 60 Min</option>
            <option value="90">passt in 90 Min</option>
          </select>
        </div>
        <div class="feld">
          <label for="fTeilnehmer">Teilnehmer</label>
          <select id="fTeilnehmer">
            <option value="">egal</option>
            <option value="4">4 Kinder</option>
            <option value="6">6 Kinder</option>
            <option value="8">8 Kinder</option>
            <option value="10">10 Kinder</option>
            <option value="15">15 Kinder</option>
            <option value="20">20 Kinder</option>
            <option value="25">25 oder mehr</option>
          </select>
        </div>
        <div class="feld">
          <label for="fOrt">Ort</label>
          <select id="fOrt">
            <option value="">egal</option>
            <option value="drinnen">drinnen</option>
            <option value="draussen">draußen</option>
          </select>
        </div>
        <div class="feld">
          <label for="fVorbereitung">Vorbereitung</label>
          <select id="fVorbereitung">
            <option value="">egal</option>
            <option value="gering">gering</option>
            <option value="mittel">mittel</option>
            <option value="hoch">hoch</option>
          </select>
        </div>
        <div class="schalter">
          <input type="checkbox" id="fOhneMaterial">
          <label for="fOhneMaterial">nur ohne Material</label>
        </div>
        <div class="schalter">
          <input type="checkbox" id="fMitAlter">
          <label for="fMitAlter">nur mit geprüfter Altersangabe</label>
        </div>
        <div class="filter-fuss">
          <button class="knopf klein" id="filterZuruecksetzen">Filter zurücksetzen</button>
        </div>
      </div>
    </details>

    <div id="kacheln" class="kacheln"></div>

    <div class="trefferzeile" id="listenkopf" hidden>
      <span id="treffer" aria-live="polite"></span>
      <select id="sortierung" aria-label="Sortierung">
        <option value="dauer">kürzeste zuerst</option>
        <option value="dauer-ab">längste zuerst</option>
        <option value="titel">A bis Z</option>
      </select>
    </div>

    <ul class="liste" id="liste"></ul>
    <div class="mehr" id="mehrZeile" hidden>
      <button class="knopf" id="mehrKnopf">Weitere anzeigen</button>
    </div>

    <footer class="fuss" id="fuss"></footer>
  </section>

  <!-- ================================================ Ansicht: Planen -->
  <section id="ansichtPlanen" hidden>
    <div class="rahmen">
      <h2>Rahmen des Abends</h2>
      <div class="filter-raster">
        <div class="feld">
          <label for="rZielzeit">Gesamtzeit</label>
          <select id="rZielzeit">
            <option value="60">60 Minuten</option>
            <option value="90">90 Minuten</option>
            <option value="120" selected>120 Minuten</option>
            <option value="150">150 Minuten</option>
            <option value="180">180 Minuten</option>
          </select>
        </div>
        <div class="feld">
          <label for="rStufe">Altersstufe</label>
          <select id="rStufe">
            <option value="">alle</option>
            <option>Wölflinge</option>
            <option>Pfadfinder</option>
            <option>Ältere</option>
          </select>
        </div>
        <div class="feld">
          <label for="rTeilnehmer">Teilnehmer</label>
          <select id="rTeilnehmer">
            <option value="">egal</option>
            <option value="4">4 Kinder</option>
            <option value="6">6 Kinder</option>
            <option value="8">8 Kinder</option>
            <option value="10">10 Kinder</option>
            <option value="15">15 Kinder</option>
            <option value="20">20 Kinder</option>
            <option value="25">25 oder mehr</option>
          </select>
        </div>
        <div class="feld">
          <label for="rOrt">Ort</label>
          <select id="rOrt">
            <option value="">egal</option>
            <option value="drinnen">drinnen</option>
            <option value="draussen">draußen</option>
          </select>
        </div>
        <div class="feld">
          <label for="rVorbereitung">Vorbereitung</label>
          <select id="rVorbereitung">
            <option value="">egal</option>
            <option value="gering">höchstens gering</option>
            <option value="mittel">höchstens mittel</option>
          </select>
        </div>
        <div class="schalter">
          <input type="checkbox" id="rOhneMaterial">
          <label for="rOhneMaterial">nur Bausteine ohne Material</label>
        </div>
      </div>
    </div>

    <div id="planSlots"></div>

    <details class="filter" id="planTextKasten">
      <summary><span>Plan als Text</span><span>zum Kopieren</span></summary>
      <div style="padding: 0 14px 14px">
        <textarea class="planausgabe" id="planText" readonly aria-label="Plan als Text"></textarea>
      </div>
    </details>

    <div class="summe">
      <div class="summe-zeile">
        <span class="slot-name">Gesamtdauer</span>
        <span class="summe-wert" id="summeWert" aria-live="polite">10 Min</span>
      </div>
      <div class="balken"><i id="summeBalken" style="width:8%"></i></div>
      <div class="summe-knoepfe">
        <button class="knopf" id="planWuerfeln">Würfeln</button>
        <button class="knopf" id="planLeeren">Leeren</button>
        <button class="knopf stark" id="planKopieren">Plan teilen</button>
      </div>
      <div class="meldung" id="planMeldung" role="status"></div>

<script>
"use strict";
/* ==================================================================
   Heimabend-Baukasten – Anwendungslogik
   Reines JavaScript, keine Bibliotheken. Läuft per Doppelklick auf
   diese Datei und genauso auf GitHub Pages.
   ================================================================== */

/* ---------------------------------------------------- Beschriftungen */
var TYP_TEXT = {
  spiel: "Spiele", probe: "Proben", aktivitaet: "Aktivitäten", projekt: "Projekte"
};
var TYP_EINZAHL = {
  spiel: "Spiel", probe: "Probe", aktivitaet: "Aktivität", projekt: "Projekt"
};
var TYP_REIHENFOLGE = ["spiel", "probe", "aktivitaet", "projekt"];

var KATEGORIE_TEXT = {
  // Spiele
  ankommen: "Ankommen & Kennenlernen", bewegung_drinnen: "Bewegung drinnen",
  bewegung_draussen: "Bewegung draußen", gelaende: "Geländespiele", kreis: "Kreisspiele",
  ruhig: "Ruhig & Konzentration", kooperation: "Kooperation", abschluss: "Abschluss",
  // Proben
  knoten: "Knoten", karte_kompass: "Karte & Kompass", feuer: "Feuer",
  erste_hilfe: "Erste Hilfe", zelte_bauten: "Zelte & Bauten", natur: "Natur",
  bundeskunde: "Bundeskunde", fahrtentechnik: "Fahrtentechnik", sonstiges: "Sonstiges",
  // Aktivitäten und Projekte
  draussen: "Draußen", kreativ: "Kreativ & Werken", kochen: "Kochen",
  musisch: "Musisch", soziales: "Gruppe & Soziales", themenabend: "Themenabende",

};

var UNTER_TEXT = {
  // Spiele
  gelaende: "Geländespiel", verstecken: "Verstecken & Suchen",
  namen: "Namen & Kennenlernen", vertrauen: "Vertrauen", team: "Zusammenarbeit",
  reflexion: "Reflexion", merken: "Merken & Kim", denken: "Denken & Rätsel",
  singen: "Singen & Tanzen", darstellen: "Darstellen", tisch: "Am Tisch",
  ball: "Ballspiele", fangen: "Fangen & Laufen", kampf: "Kraft & Kampf",
  wettkampf: "Wettkampf & Staffel", reaktion: "Reaktion", konzentration: "Konzentration",
  geschick: "Geschicklichkeit", ruhig: "Ruhige Spiele", warmup: "Warm-up",
  toben: "Toben", sonstiges: "Sonstiges",
  // Projekte
  pfaditechnik: "Pfadfindertechnik", kochen: "Kochen & Backen",
  basteln: "Basteln & Werken", natur: "Natur", bund: "Bund & Geschichte",
  nachhaltigkeit: "Nachhaltigkeit", gruppe: "Gruppe & Sippe", musisch: "Musisches",
  spiel: "Spielerisches"
};

var ORT_TEXT = { drinnen: "drinnen", draussen: "draußen", beides: "drinnen & draußen" };
var ALTERSSTUFEN = ["Wölflinge", "Pfadfinder", "Ältere"];

/* Feste Bestandteile jedes Heimabends – Rituale, keine Bausteine. */
var KREIS_DAUER = 5;

/* Die Plätze, die gefüllt werden können. */
var SLOTS = [
  { schluessel: "einstieg", name: "Einstiegsspiel", zieldauer: 15,
    passt: function (e) { return e.element_typ === "spiel" && hat(e.slots, "einstieg"); } },
  { schluessel: "haupt", name: "Hauptteil", mehrfach: true,
    passt: function (e) {
      if (!hat(e.slots, "hauptteil")) return false;
      // Ein Projekt füllt einen ganzen Heimabend. Neben einem zweiten Baustein
      // im Hauptteil ergibt das keinen Sinn – dann fällt es raus.
      if (e.element_typ === "projekt" && plan.haupt.length > 1) return false;
      return true;
    } },
  { schluessel: "abschluss", name: "Abschlussspiel", zieldauer: 15,
    passt: function (e) { return e.element_typ === "spiel" && hat(e.slots, "abschluss"); } }
];
var SEITENGROESSE = 30;
/* Ab so vielen Einträgen lohnt sich die dritte Ebene (Unterkategorien). */
var UNTEREBENE_AB = 20;

/* ------------------------------------------------------------ Zustand */
var ALLE = [];
// Object.create(null): sonst liefert NACH_ID["constructor"] ein Objekt der
// Prototypkette und die Planansicht stürzt bei kaputtem Speicher ab.
var NACH_ID = Object.create(null);
var pfad = { typ: "", kategorie: "", unterkategorie: "" };
var gefiltert = [];
var sichtbar = SEITENGROESSE;

var plan = { einstieg: null, haupt: [null, null], abschluss: null };
var rahmen = { zielzeit: 120, stufe: "", teilnehmer: 0, ort: "", vorbereitung: "",
               ohneMaterial: false };

var auswahlZiel = null;          // { slot, index, zielzeit }
var auswahlPfad = { typ: "", kategorie: "", unterkategorie: "" };
var auswahlListe = [];
var auswahlSichtbar = SEITENGROESSE;

/* ------------------------------------------------------------ Helfer */
function $(id) { return document.getElementById(id); }
function hat(liste, wert) { return !!liste && liste.indexOf(wert) !== -1; }

function schuetze(text) {
  return String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/** Kleinbuchstaben ohne Umlaute – für Suche und Vergleiche. */
function vereinfache(text) {
  return String(text || "").toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
}

function dauerText(e) {
  return e.dauer_min === e.dauer_max
    ? e.dauer_min + " Min" : e.dauer_min + "–" + e.dauer_max + " Min";
}
function mitteldauer(e) { return (e.dauer_min + e.dauer_max) / 2; }
function aufFuenf(zahl) { return Math.max(5, Math.round(zahl / 5) * 5); }

function gruppenText(e) {
  if (e.gruppe_min && e.gruppe_max) return e.gruppe_min + "–" + e.gruppe_max + " Personen";
  if (e.gruppe_min) return "ab " + e.gruppe_min + " Personen";
  if (e.gruppe_max) return "bis " + e.gruppe_max + " Personen";
  return "";
}
/** True, wenn die Quelle gar nichts zum Alter sagt (betrifft rund zwei Drittel). */
function ohneAltersangabe(e) {
  return !(e.altersstufen && e.altersstufen.length) && !e.alter_ab;
}
function stufenText(e) {
  if (e.altersstufen && e.altersstufen.length) return e.altersstufen.join(", ");
  // Nicht "alle Stufen" behaupten, was die Quelle nicht hergibt
  return "keine Angabe – bitte selbst einschätzen";
}
function kategorieText(e) { return KATEGORIE_TEXT[e.kategorie] || e.kategorie; }
function unterText(schluessel) { return UNTER_TEXT[schluessel] || schluessel; }

/**
 * Wandelt das leichte Markdown der Beschreibungen in HTML:
 * "## Überschrift", "- Aufzählung" und **fett**.
 */
function textZuHtml(roh) {
  var zeilen = String(roh || "").split("\n");
  var teile = [], absatz = [], liste = [];
  function absatzSchliessen() {
    if (absatz.length) { teile.push("<p>" + absatz.join(" ") + "</p>"); absatz = []; }
  }
  function listeSchliessen() {
    if (liste.length) { teile.push("<ul>" + liste.join("") + "</ul>"); liste = []; }
  }
  for (var i = 0; i < zeilen.length; i++) {
    var zeile = zeilen[i].trim();
    var inhalt = schuetze(zeile).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    if (!zeile) { absatzSchliessen(); listeSchliessen(); continue; }
    var ueberschrift = zeile.match(/^(#{2,4})\s+(.*)$/);
    if (ueberschrift) {
      absatzSchliessen(); listeSchliessen();
      teile.push("<h4>" + schuetze(ueberschrift[2]) + "</h4>");
    } else if (zeile.indexOf("- ") === 0) {
      absatzSchliessen();
      liste.push("<li>" + inhalt.slice(2) + "</li>");
    } else {
      listeSchliessen();
      absatz.push(inhalt);
    }
  }
  absatzSchliessen(); listeSchliessen();
  return teile.join("");
}

/* ------------------------------------------------------------ Laden */
/**
 * Holt die Daten. Auf einem Webserver (GitHub Pages) klappt fetch.
 * Beim Doppelklick auf die Datei sperrt der Browser fetch – dann wird
 * elemente.js nachgeladen, das dieselben Daten als window.ELEMENTE enthält.
 */
function ladeDaten() {
  return fetch("../data/elemente.json")
    .then(function (antwort) {
      if (!antwort.ok) throw new Error("HTTP " + antwort.status);
      return antwort.json();
    })
    .then(function (inhalt) { return inhalt.elemente || inhalt; })
    .catch(ladeSkriptdaten);
}
function ladeSkriptdaten() {
  return new Promise(function (fertig, fehler) {
    if (window.ELEMENTE) { fertig(window.ELEMENTE); return; }
    var skript = document.createElement("script");
    skript.src = "elemente.js";
    skript.onload = function () {
      window.ELEMENTE ? fertig(window.ELEMENTE) : fehler(new Error("elemente.js ohne Daten"));
    };
    skript.onerror = function () { fehler(new Error("elemente.js nicht gefunden")); };
    document.head.appendChild(skript);
  });
}

/* ------------------------------------------------------------ Filtern */
function leereFilter() {
  return { suche: "", stufe: "", dauer: 0, teilnehmer: 0, ort: "",
           vorbereitung: "", ohneMaterial: false, mitAlter: false };
}

/** Die Einstellungen aus dem Filter-Klappfeld der Baustein-Ansicht. */
function filterWerte() {
  return {
    suche: vereinfache($("suche").value.trim()),
    stufe: $("fStufe").value,
    dauer: $("fDauer").value ? parseInt($("fDauer").value, 10) : 0,
    teilnehmer: $("fTeilnehmer").value ? parseInt($("fTeilnehmer").value, 10) : 0,
    ort: $("fOrt").value,
    vorbereitung: $("fVorbereitung").value,
    ohneMaterial: $("fOhneMaterial").checked,
    mitAlter: $("fMitAlter").checked
  };
}

/** Zählt die gesetzten Filter – der zugeklappte Kasten verriet das bisher nicht. */
function aktiveFilter() {
  var f = filterWerte(), zahl = 0;
  ["stufe", "dauer", "teilnehmer", "ort", "vorbereitung"].forEach(function (name) {
    if (f[name]) zahl++;
  });
  if (f.ohneMaterial) zahl++;
  if (f.mitAlter) zahl++;
  return zahl;
}

function setzeFilterZurueck() {
  ["fStufe", "fDauer", "fTeilnehmer", "fOrt", "fVorbereitung"].forEach(function (id) {
    $(id).value = "";
  });
  $("fOhneMaterial").checked = false;
  $("fMitAlter").checked = false;
  aktualisiere();
}

/** Die Vorauswahl aus dem "Rahmen des Abends" im Planer. */
function rahmenFilter() {
  var f = leereFilter();
  f.stufe = rahmen.stufe;
  f.teilnehmer = rahmen.teilnehmer;
  f.ort = rahmen.ort;
  f.ohneMaterial = rahmen.ohneMaterial;
  f.vorbereitungHoechstens = rahmen.vorbereitung;
  return f;
}

var VORBEREITUNG_RANG = { gering: 1, mittel: 2, hoch: 3 };

function passtZuFilter(e, f) {
  // Elemente ohne Altersangabe (z. B. Spielewiki) gelten für alle Stufen
  if (f.stufe && e.altersstufen && e.altersstufen.length && !hat(e.altersstufen, f.stufe)) return false;
  // Nach der Obergrenze filtern, nicht nach der Untergrenze: wer "passt in
  // 15 Min" wählt, hat 15 Minuten – und nicht 15 bis 30.
  if (f.dauer && e.dauer_max > f.dauer) return false;
  // Gruppengröße: Elemente ohne Angabe bleiben drin, sonst fiele der halbe
  // Bestand weg; sie werden auf der Karte als "Gruppengröße unbekannt" geführt.
  if (f.teilnehmer) {
    if (e.gruppe_min && e.gruppe_min > f.teilnehmer) return false;
    if (e.gruppe_max && e.gruppe_max < f.teilnehmer) return false;
  }
  if (f.ort && e.ort !== f.ort && e.ort !== "beides") return false;
  if (f.vorbereitung && e.vorbereitung !== f.vorbereitung) return false;
  if (f.vorbereitungHoechstens &&
      VORBEREITUNG_RANG[e.vorbereitung] > VORBEREITUNG_RANG[f.vorbereitungHoechstens]) return false;
  if (f.ohneMaterial && e.material && e.material.length) return false;
  if (f.mitAlter && ohneAltersangabe(e)) return false;
  if (f.suche) {
    // Mehrere Wörter werden einzeln geprüft, sonst findet "Gelände spiel" nichts.
    var woerter = f.suche.split(/\s+/);
    for (var w = 0; w < woerter.length; w++) {
      if (woerter[w] && e._suchtext.indexOf(woerter[w]) === -1) return false;
    }
  }
  return true;
}

function passtZuPfad(e, p) {
  if (p.typ && e.element_typ !== p.typ) return false;
  if (p.kategorie && e.kategorie !== p.kategorie) return false;
  if (p.unterkategorie && e.unterkategorie !== p.unterkategorie) return false;
  return true;
}

function sammle(f, p, zusatz) {
  var ergebnis = [];
  for (var i = 0; i < ALLE.length; i++) {
    var e = ALLE[i];
    if (p && !passtZuPfad(e, p)) continue;
    if (zusatz && !zusatz(e)) continue;
    if (passtZuFilter(e, f)) ergebnis.push(e);
  }
  return ergebnis;
}

/* --------------------------------------------------------- Sortieren */
function nachTitel(a, b) {
  return a.titel.localeCompare(b.titel, "de",
         { ignorePunctuation: true, numeric: true, sensitivity: "base" });
}

/**
 * Wie gut passt ein Element zum Suchbegriff? Kleiner ist besser.
 * Ohne das steht bei "knoten" ein Bastelabend oben, in dessen Beschreibung
 * das Wort irgendwo vorkommt, und die Knoten-Olympiade weit unten.
 */
function suchrang(e, suche, woerter) {
  var titel = e._titeltext;
  if (titel === suche) return 0;
  if (titel.indexOf(suche) !== -1) return 1;
  var w;
  for (w = 0; w < woerter.length; w++) if (titel.indexOf(woerter[w]) === -1) break;
  if (w === woerter.length) return 2;
  for (w = 0; w < woerter.length; w++) if (e._kopftext.indexOf(woerter[w]) === -1) break;
  if (w === woerter.length) return 3;
  return 4;
}

function sortiere(liste, art, suche, stufe) {
  // Rang einmal je Element bestimmen. Im Vergleicher berechnet, wären es bei
  // 700 Treffern rund 13000 Aufrufe pro Tastendruck.
  if (suche) {
    var woerter = suche.split(/\s+/).filter(Boolean);
    for (var i = 0; i < liste.length; i++) {
      liste[i]._rang = suchrang(liste[i], suche, woerter);
    }
  }
  return liste.sort(function (a, b) {
    // Ist eine Altersstufe gewählt, stehen geprüfte Bausteine vorn und die
    // ohne Altersangabe hinten – herausfiltern wäre zu hart, sie sind zu viele.
    if (stufe) {
      var offenA = ohneAltersangabe(a) ? 1 : 0, offenB = ohneAltersangabe(b) ? 1 : 0;
      if (offenA !== offenB) return offenA - offenB;
    }
    if (suche && a._rang !== b._rang) return a._rang - b._rang;
    if (art === "dauer" && a.dauer_min !== b.dauer_min) return a.dauer_min - b.dauer_min;
    if (art === "dauer-ab" && a.dauer_min !== b.dauer_min) return b.dauer_min - a.dauer_min;
    return nachTitel(a, b);
  });
}

/* ------------------------------------------------------------ Karten */
function karteHtml(e, zielzeit) {
  var merkmale = "";
  if (zielzeit) {
    merkmale += '<span class="merkmal zeit">' + schuetze(dauerText(e)) + "</span>";
  } else {
    merkmale += '<span class="merkmal typ">' + schuetze(TYP_EINZAHL[e.element_typ]) + "</span>";
    merkmale += '<span class="merkmal">' + schuetze(dauerText(e)) + "</span>";
  }
  merkmale += '<span class="merkmal">' + schuetze(kategorieText(e)) + "</span>";
  if (e.unterkategorie && e.unterkategorie !== "sonstiges") {
    merkmale += '<span class="merkmal">' + schuetze(unterText(e.unterkategorie)) + "</span>";
  }
  merkmale += '<span class="merkmal">' + schuetze(ORT_TEXT[e.ort] || e.ort) + "</span>";
  if (!e.material || !e.material.length) merkmale += '<span class="merkmal">ohne Material</span>';
  if (ohneAltersangabe(e)) merkmale += '<span class="merkmal offen">Alter offen</span>';
  // Gibt es denselben Titel in einer anderen Quelle, hilft der Quellname beim Unterscheiden
  if (e.dubletten && e.dubletten.length) {
    merkmale += '<span class="merkmal">' + schuetze((e.quelle || {}).name || "") + "</span>";
  }
  return "<h3>" + schuetze(e.titel) + "</h3>" +
         "<p>" + schuetze(e.kurz) + "</p>" +
         '<div class="merkmale">' + merkmale + "</div>";
}

function baueKarte(e, beiKlick, zielzeit) {
  var eintrag = document.createElement("li");
  var knopf = document.createElement("button");
  knopf.className = "karte";
  knopf.type = "button";
  // Kurzer Name fürs Vorleseprogramm; sonst liest es Titel, Kurztext und
  // sechs Plaketten am Stück vor.
  knopf.setAttribute("aria-label", e.titel);
  knopf.innerHTML = karteHtml(e, zielzeit);
  knopf.addEventListener("click", function () { beiKlick(e); });
  eintrag.appendChild(knopf);
  return eintrag;
}

/* ------------------------------------------------- Ansicht: Bausteine */
/** Zählt, wie viele Elemente unter einem Pfad liegen (mit Filtern). */
function zaehleNach(feld, f, p) {
  var zaehler = {};
  for (var i = 0; i < ALLE.length; i++) {
    var e = ALLE[i];
    if (!passtZuPfad(e, p)) continue;
    if (!passtZuFilter(e, f)) continue;
    var wert = e[feld];
    if (!wert) continue;
    zaehler[wert] = (zaehler[wert] || 0) + 1;
  }
  return zaehler;
}

function baueKachel(name, anzahl, beiKlick, gross) {
  var knopf = document.createElement("button");
  knopf.type = "button";
  knopf.className = "kachel" + (gross ? " gross" : "");
  knopf.innerHTML = '<span class="name">' + schuetze(name) + "</span>" +
                    '<span class="zahl">' + anzahl +
                    (anzahl === 1 ? " Baustein" : " Bausteine") + "</span>";
  knopf.addEventListener("click", beiKlick);
  return knopf;
}

function zeichnePfad() {
  var teile = [];
  teile.push({ name: "Alle Bausteine", ziel: { typ: "", kategorie: "", unterkategorie: "" } });
  if (pfad.typ) {
    teile.push({ name: TYP_TEXT[pfad.typ],
                 ziel: { typ: pfad.typ, kategorie: "", unterkategorie: "" } });
  }
  if (pfad.kategorie) {
    teile.push({ name: KATEGORIE_TEXT[pfad.kategorie] || pfad.kategorie,
                 ziel: { typ: pfad.typ, kategorie: pfad.kategorie, unterkategorie: "" } });
  }
  if (pfad.unterkategorie) {
    teile.push({ name: pfad.unterkategorie === "__alle__"
                       ? "Alle" : unterText(pfad.unterkategorie), ziel: null });
  }
  var behaelter = $("pfad");
  behaelter.innerHTML = "";
  for (var i = 0; i < teile.length; i++) {
    if (i > 0) {
      var pfeil = document.createElement("span");
      pfeil.className = "pfeil"; pfeil.textContent = "›";
      pfeil.setAttribute("aria-hidden", "true");
      behaelter.appendChild(pfeil);
    }
    if (i === teile.length - 1) {
      var jetzt = document.createElement("span");
      jetzt.className = "jetzt"; jetzt.textContent = teile[i].name;
      jetzt.setAttribute("aria-current", "page");
      behaelter.appendChild(jetzt);
    } else {
      var knopf = document.createElement("button");
      knopf.type = "button"; knopf.textContent = teile[i].name;
      (function (ziel) {
        knopf.addEventListener("click", function () { pfad = ziel; aktualisiere(); });
      })(teile[i].ziel);
      behaelter.appendChild(knopf);
    }
  }
}

/**
 * Entscheidet, ob Kacheln oder die Liste gezeigt werden.
 * Gesucht wird immer in der Liste – dann will man Treffer sehen, keine Kacheln.
 */
function aktualisiere() {
  var f = filterWerte();
  var zahl = aktiveFilter();
  $("filterZahl").textContent = zahl ? zahl + " aktiv" : "";
  zeichnePfad();

  var kacheln = $("kacheln");
  kacheln.innerHTML = "";

  // "__alle__" heißt: der Nutzer hat "Alle anzeigen" gedrückt und will die
  // Liste sehen, egal auf welcher Ebene er gerade steht.
  if (!f.suche && pfad.unterkategorie !== "__alle__") {
    if (!pfad.typ) { zeigeKacheln(kacheln, "typ", f); return; }
    if (!pfad.kategorie) { zeigeKacheln(kacheln, "kategorie", f); return; }
    if (!pfad.unterkategorie) {
      var unter = zaehleNach("unterkategorie", f, pfad);
      var schluessel = Object.keys(unter);
      var summe = sammle(f, pfad).length;
      // Dritte Ebene nur, wenn sie wirklich hilft
      if (schluessel.length > 1 && summe > UNTEREBENE_AB) {
        zeigeKacheln(kacheln, "unterkategorie", f);
        return;
      }
    }
  }

  zeigeListe(f);
}

function zeigeKacheln(behaelter, ebene, f) {
  $("listenkopf").hidden = true;
  $("liste").innerHTML = "";
  $("mehrZeile").hidden = true;
  // Wichtig: sonst zieht der Zufallsknopf aus einer Liste, die zu einer
  // ganz anderen Kategorie gehörte. Er soll aus dem ziehen, was hier zu sehen ist.
  gefiltert = sammle(f, pfad);
  $("zufallKnopf").disabled = gefiltert.length === 0;

  var eintraege = [];
  if (ebene === "typ") {
    var nachTyp = zaehleNach("element_typ", f, { typ: "", kategorie: "", unterkategorie: "" });
    for (var t = 0; t < TYP_REIHENFOLGE.length; t++) {
      var typ = TYP_REIHENFOLGE[t];
      if (nachTyp[typ]) {
        eintraege.push({ name: TYP_TEXT[typ], anzahl: nachTyp[typ],
                         ziel: { typ: typ, kategorie: "", unterkategorie: "" } });
      }
    }
  } else if (ebene === "kategorie") {
    var nachKat = zaehleNach("kategorie", f, pfad);
    eintraege = Object.keys(nachKat).map(function (k) {
      return { name: KATEGORIE_TEXT[k] || k, anzahl: nachKat[k],
               ziel: { typ: pfad.typ, kategorie: k, unterkategorie: "" } };
    });
  } else {
    var nachUnter = zaehleNach("unterkategorie", f, pfad);
    eintraege = Object.keys(nachUnter).map(function (u) {
      return { name: unterText(u), anzahl: nachUnter[u],
               ziel: { typ: pfad.typ, kategorie: pfad.kategorie, unterkategorie: u } };
    });
  }
  eintraege.sort(function (a, b) { return b.anzahl - a.anzahl; });

  if (!eintraege.length) {
    behaelter.innerHTML = '<p class="leer" style="grid-column:1/-1">' +
      "Mit diesen Filtern bleibt nichts übrig.<br>" +
      '<button type="button" id="leerReset">Filter zurücksetzen</button></p>';
    $("leerReset").addEventListener("click", setzeFilterZurueck);
    return;
  }
  for (var i = 0; i < eintraege.length; i++) {
    (function (eintrag) {
      behaelter.appendChild(baueKachel(eintrag.name, eintrag.anzahl, function () {
        pfad = eintrag.ziel;
        window.scrollTo(0, 0);
        aktualisiere();
      }));
    })(eintraege[i]);
  }
  // Auf den unteren Ebenen: alles der Ebene auf einmal ansehen
  if (ebene !== "typ") {
    var alle = sammle(f, pfad);
    behaelter.appendChild(baueKachel("Alle anzeigen", alle.length, function () {
      pfad = { typ: pfad.typ, kategorie: pfad.kategorie, unterkategorie: "__alle__" };
      window.scrollTo(0, 0);
      aktualisiere();
    }, true));
  }
}

function zeigeListe(f) {
  var suchPfad = {
    typ: pfad.typ, kategorie: pfad.kategorie,
    unterkategorie: pfad.unterkategorie === "__alle__" ? "" : pfad.unterkategorie
  };
  gefiltert = sortiere(sammle(f, suchPfad), $("sortierung").value, f.suche, f.stufe);
  sichtbar = SEITENGROESSE;
  $("listenkopf").hidden = false;
  var offene = 0;
  for (var i = 0; i < gefiltert.length; i++) if (ohneAltersangabe(gefiltert[i])) offene++;
  $("treffer").textContent = (gefiltert.length === 1
    ? "1 Baustein" : gefiltert.length + " Bausteine") +
    (f.stufe && offene ? " · " + offene + " ohne Altersangabe" : "");
  $("zufallKnopf").disabled = gefiltert.length === 0;
  zeichneListe(f);
}

function zeichneListe(f) {
  var behaelter = $("liste");
  behaelter.innerHTML = "";
  if (!gefiltert.length) {
    var text = '<li><p class="leer">Nichts gefunden.<br>';
    if (f && f.suche && (pfad.typ || pfad.kategorie)) {
      text += '<button type="button" id="ueberallSuchen">Überall suchen</button> · ';
    }
    text += '<button type="button" id="leerReset2">Filter zurücksetzen</button></p></li>';
    behaelter.innerHTML = text;
    if ($("ueberallSuchen")) {
      $("ueberallSuchen").addEventListener("click", function () {
        pfad = { typ: "", kategorie: "", unterkategorie: "" };
        aktualisiere();
      });
    }
    $("leerReset2").addEventListener("click", setzeFilterZurueck);
    $("mehrZeile").hidden = true;
    return;
  }
  var stapel = document.createDocumentFragment();
  var bis = Math.min(sichtbar, gefiltert.length);
  for (var i = 0; i < bis; i++) stapel.appendChild(baueKarte(gefiltert[i], zeigeDetail));
  behaelter.appendChild(stapel);
  $("mehrZeile").hidden = bis >= gefiltert.length;
  $("mehrKnopf").textContent = "Weitere anzeigen (" + (gefiltert.length - bis) + ")";
}

/* ------------------------------------------------------ Detailansicht */
function zeigeDetail(e) {
  $("detailTitel").textContent = e.titel;

  var html = "<h2>" + schuetze(e.titel) + "</h2>";
  html += '<p style="color:var(--leise);margin:0 0 4px">' + schuetze(e.kurz) + "</p>";

  // Ohne diese Zeile sind Stöbern und Planen zwei getrennte Apps: man findet
  // etwas, muss den Reiter wechseln und den Titel erneut suchen.
  var moegliche = SLOTS.filter(function (s) { return passtGrob(e, s); });
  if (moegliche.length) {
    html += '<div class="planzeile"><span class="chiptitel">In den Plan</span><div class="chips">';
    for (var s = 0; s < moegliche.length; s++) {
      html += '<button type="button" class="knopf klein" data-slot="' +
              schuetze(moegliche[s].schluessel) + '">' + schuetze(moegliche[s].name) + "</button>";
    }
    html += "</div></div>";
  }

  html += '<dl class="datenblatt">';
  html += "<dt>Art</dt><dd>" + schuetze(TYP_EINZAHL[e.element_typ]) +
          " · " + schuetze(kategorieText(e)) +
          (e.unterkategorie ? " · " + schuetze(unterText(e.unterkategorie)) : "") + "</dd>";
  html += "<dt>Dauer</dt><dd>" + schuetze(dauerText(e)) + "</dd>";
  html += "<dt>Ort</dt><dd>" + schuetze(ORT_TEXT[e.ort] || e.ort) + "</dd>";
  html += "<dt>Alter</dt><dd>" + schuetze(stufenText(e)) +
          (e.alter_ab ? " · ab " + schuetze(e.alter_ab) + " Jahren" : "") + "</dd>";
  var gruppe = gruppenText(e);
  if (gruppe) html += "<dt>Gruppe</dt><dd>" + schuetze(gruppe) + "</dd>";
  html += "<dt>Material</dt><dd>" +
          (e.material && e.material.length ? schuetze(e.material.join(", ")) : "keines") + "</dd>";
  html += "<dt>Vorbereitung</dt><dd>" + schuetze(e.vorbereitung) + "</dd>";
  if (e.themen && e.themen.length) {
    html += "<dt>Themen</dt><dd>" + schuetze(e.themen.join(", ")) + "</dd>";
  }
  html += "</dl>";

  html += '<div class="text">' + textZuHtml(e.beschreibung) + "</div>";

  if (e.tipps) {
    html += '<div class="kasten tipp"><h4>Hinweise für die Spielleitung</h4>' +
            '<div class="text">' + textZuHtml(e.tipps) + "</div></div>";
  }

  if (e.dubletten && e.dubletten.length) {
    var verweise = [];
    for (var d = 0; d < e.dubletten.length; d++) {
      var andere = NACH_ID[e.dubletten[d]];
      if (andere) {
        verweise.push('<button type="button" data-id="' + schuetze(andere.id) + '">' +
                      schuetze(andere.quelle.name) + "</button>");
      }
    }
    if (verweise.length) {
      html += '<div class="kasten dublette"><h4>Gibt es auch bei</h4>' +
              verweise.join(" · ") + "</div>";
    }
  }

  var q = e.quelle || {};
  html += '<div class="kasten quelle"><h4>Quelle</h4>';
  html += schuetze(q.name || "") + (q.autor ? " · " + schuetze(q.autor) : "");
  if (q.url) {
    html += '<br><a href="' + schuetze(q.url) + '" target="_blank" rel="noopener">' +
            schuetze(q.url) + "</a>";
  }
  html += "<br>Lizenz: " + schuetze(q.lizenz || "unbekannt") + "</div>";

  $("detailInhalt").innerHTML = html;
  $("detailInhalt").scrollTop = 0;

  var planKnoepfe = $("detailInhalt").querySelectorAll(".planzeile button[data-slot]");
  for (var pk = 0; pk < planKnoepfe.length; pk++) {
    planKnoepfe[pk].addEventListener("click", function () {
      inDenPlan(e, this.getAttribute("data-slot"));
    });
  }

  var knoepfe = $("detailInhalt").querySelectorAll(".kasten.dublette button");
  for (var b = 0; b < knoepfe.length; b++) {
    knoepfe[b].addEventListener("click", function () {
      var ziel = NACH_ID[this.getAttribute("data-id")];
      if (ziel) zeigeDetail(ziel);
    });
  }
  oeffneUeberlagerung($("detail"));
}

/**
 * Grobe Prüfung für die "In den Plan"-Knöpfe: hier darf auch ein Projekt in
 * den Hauptteil, wenn der Nutzer das ausdrücklich will.
 */
function passtGrob(e, slot) {
  if (slot.schluessel === "haupt") return hat(e.slots, "hauptteil");
  return e.element_typ === "spiel" && hat(e.slots, slot.schluessel);
}

/** Setzt einen Baustein auf den ersten freien passenden Platz. */
function inDenPlan(e, schluessel) {
  if (schluessel === "haupt") {
    var ziel = -1;
    for (var i = 0; i < plan.haupt.length; i++) {
      if (!planElement("haupt", i)) { ziel = i; break; }
    }
    if (ziel === -1) { plan.haupt.push(null); ziel = plan.haupt.length - 1; }
    plan.haupt[ziel] = e.id;
  } else {
    plan[schluessel] = e.id;
  }
  speicherePlan();
  schliesseUeberlagerung($("detail"));
  zeigeAnsicht("planen");
  melde("„" + e.titel + "“ steht jetzt im Plan.");
}

/* -------------------------------------------------- Überlagerungen */
var letzterAusloeser = null;

function oeffneUeberlagerung(knoten) {
  var warOffen = !knoten.hidden;
  if (!warOffen) letzterAusloeser = document.activeElement;
  knoten.hidden = false;
  knoten.scrollTop = 0;
  document.body.style.overflow = "hidden";
  // Hintergrund stilllegen, sonst läuft die Tabulatortaste hinter die Überlagerung
  document.querySelector("header.kopf").inert = true;
  document.querySelector("main.huelle").inert = true;
  var ersterKnopf = knoten.querySelector("button");
  if (ersterKnopf) ersterKnopf.focus();
  // Damit die Zurück-Taste am Handy die Überlagerung schließt und nicht die App
  if (!warOffen) { try { history.pushState({ ueberlagerung: knoten.id }, ""); } catch (f) { /* egal */ } }
}

function schliesseUeberlagerung(knoten, ausDemVerlauf) {
  if (knoten.hidden) return;
  knoten.hidden = true;
  if ($("detail").hidden && $("auswahl").hidden) {
    document.body.style.overflow = "";
    document.querySelector("header.kopf").inert = false;
    document.querySelector("main.huelle").inert = false;
  }
  if (letzterAusloeser && letzterAusloeser.focus) {
    try { letzterAusloeser.focus(); } catch (f) { /* egal */ }
  }
  if (!ausDemVerlauf) { try { history.back(); } catch (f) { /* egal */ } }
}

window.addEventListener("popstate", function () {
  if (!$("detail").hidden) schliesseUeberlagerung($("detail"), true);
  else if (!$("auswahl").hidden) schliesseUeberlagerung($("auswahl"), true);
});

/* ------------------------------------------------------ Ansicht: Plan */
function planElement(schluessel, index) {
  var id = schluessel === "haupt" ? plan.haupt[index] : plan[schluessel];
  if (!id || typeof id !== "string") return null;
  return NACH_ID[id] || null;
}

/** Alle Plätze als flache Liste – erleichtert das Rechnen. */
function alleSlots() {
  var liste = [];
  for (var s = 0; s < SLOTS.length; s++) {
    var anzahl = SLOTS[s].mehrfach ? plan.haupt.length : 1;
    for (var i = 0; i < anzahl; i++) liste.push({ slot: SLOTS[s], index: i });
  }
  return liste;
}

/** Wie viele Minuten sind noch frei, wenn dieser Platz nicht mitzählt? */
function freieZeit(ausser) {
  var belegt = 0;
  var slots = alleSlots();
  for (var i = 0; i < slots.length; i++) {
    if (ausser && slots[i].slot.schluessel === ausser.slot.schluessel &&
        slots[i].index === ausser.index) continue;
    var e = planElement(slots[i].slot.schluessel, slots[i].index);
    if (e) belegt += mitteldauer(e);
  }
  return Math.max(0, rahmen.zielzeit - KREIS_DAUER * 2 - belegt);
}

/**
 * Wie lang sollte der Baustein für diesen Platz sein?
 * Anzeige, Vorschläge und Würfeln benutzen dieselbe Zahl – vorher sagte die
 * Slot-Karte "ca. 5 Min" und gewürfelt wurden 15.
 */
function zieldauerFuer(slot, index) {
  if (slot.zieldauer) return slot.zieldauer;
  var rest = freieZeit({ slot: slot, index: index });
  // Was Einstieg und Abschluss noch brauchen, gehört nicht dem Hauptteil
  for (var s = 0; s < SLOTS.length; s++) {
    if (SLOTS[s].mehrfach) continue;
    if (!planElement(SLOTS[s].schluessel, 0)) rest -= SLOTS[s].zieldauer;
  }
  var offen = 0;
  for (var i = 0; i < plan.haupt.length; i++) if (!planElement("haupt", i)) offen++;
  var anteil = rest / Math.max(1, offen);
  // Untergrenze an die Zielzeit koppeln: bei 60 Minuten und drei Plätzen
  // sind starre 15 Minuten je Platz rechnerisch nicht unterzubringen.
  return Math.max(5, aufFuenf(Math.max(anteil, Math.min(15, anteil))));
}

/** Wie viele Plätze sind noch leer? */
function leerePlaetze() {
  var slots = alleSlots(), zahl = 0;
  for (var i = 0; i < slots.length; i++) {
    if (!planElement(slots[i].slot.schluessel, slots[i].index)) zahl++;
  }
  return zahl;
}

function zeichnePlan() {
  var behaelter = $("planSlots");
  behaelter.innerHTML = "";

  behaelter.appendChild(festerSlot("Eröffnungskreis",
    "Kreis schließen, kurz etwas sagen, mit dem Bundesgruß eröffnen."));

  for (var s = 0; s < SLOTS.length; s++) {
    var slot = SLOTS[s];
    if (slot.mehrfach) {
      for (var i = 0; i < plan.haupt.length; i++) behaelter.appendChild(slotKarte(slot, i));
      var hinzu = document.createElement("div");
      hinzu.className = "slot-knoepfe";
      hinzu.style.margin = "0 0 8px";
      hinzu.innerHTML = '<button class="knopf klein" type="button" id="hauptteilPlus">' +
                        "+ Baustein im Hauptteil</button>";
      behaelter.appendChild(hinzu);
      $("hauptteilPlus").addEventListener("click", function () {
        plan.haupt.push(null); speicherePlan(); zeichnePlan();
      });
    } else {
      behaelter.appendChild(slotKarte(slot, 0));
    }
  }

  behaelter.appendChild(festerSlot("Schlusskreis",
    "Kreis noch einmal schließen, dann gehen alle ihrer Wege."));

  aktualisiereSumme();
  $("planText").value = planAlsText();
}

function festerSlot(name, beschreibung) {
  var knoten = document.createElement("div");
  knoten.className = "slot fest";
  knoten.innerHTML =
    '<div class="slot-kopf"><span class="slot-name">' + schuetze(name) + "</span>" +
    '<span class="slot-dauer">' + KREIS_DAUER + " Min</span></div>" +
    '<div class="slot-inhalt"><div class="kurz">' + schuetze(beschreibung) + "</div></div>";
  return knoten;
}

function slotKarte(slot, index) {
  var e = planElement(slot.schluessel, index);
  var mehrere = slot.mehrfach && plan.haupt.length > 1;
  var name = slot.name + (mehrere ? " " + (index + 1) : "");

  var knoten = document.createElement("div");
  knoten.className = "slot";
  var html = '<div class="slot-kopf"><span class="slot-name">' + schuetze(name) + "</span>" +
             '<span class="slot-dauer">' + (e ? schuetze(dauerText(e)) : "–") + "</span></div>";
  html += '<div class="slot-inhalt">';
  if (e) {
    html += '<div class="gewaehlt">' + schuetze(e.titel) + "</div>" +
            '<div class="kurz">' + schuetze(e.kurz) + "</div>" +
            '<div class="quellzeile">' + schuetze(kategorieText(e)) + " · " +
            schuetze((e.quelle || {}).name || "") + "</div>";
  } else {
    var frei = freieZeit({ slot: slot, index: index });
    var vorschlag = zieldauerFuer(slot, index);
    html += '<div class="frei">' + (frei > 0
      ? "noch " + Math.round(frei) + " Min frei · Vorschläge für ca. " + vorschlag + " Min"
      : "Die Zielzeit ist schon voll – dieser Platz verlängert den Abend um ca. " +
        vorschlag + " Min") + "</div>";
  }
  html += "</div>";

  html += '<div class="slot-knoepfe">';
  if (!e) html += '<button class="knopf klein stark" type="button" data-tat="vorschlag">Vorschläge</button>';
  html += '<button class="knopf klein" type="button" data-tat="waehlen">' +
          (e ? "Anderen wählen" : "Alle durchsuchen") + "</button>" +
          '<button class="knopf klein" type="button" data-tat="zufall">Zufall</button>';
  if (e) {
    html += '<button class="knopf klein" type="button" data-tat="ansehen">Ansehen</button>' +
            '<button class="knopf klein" type="button" data-tat="leeren">Entfernen</button>';
  }
  if (slot.mehrfach && plan.haupt.length > 1) {
    html += '<button class="knopf klein" type="button" data-tat="weg">Platz löschen</button>';
  }
  html += "</div>";
  knoten.innerHTML = html;

  var knoepfe = knoten.querySelectorAll("button[data-tat]");
  for (var k = 0; k < knoepfe.length; k++) {
    knoepfe[k].addEventListener("click", function () {
      slotAktion(this.getAttribute("data-tat"), slot, index);
    });
  }
  return knoten;
}

function slotSetzen(schluessel, index, id) {
  if (schluessel === "haupt") plan.haupt[index] = id;
  else plan[schluessel] = id;
  speicherePlan();
  zeichnePlan();
}

function slotAktion(tat, slot, index) {
  if (tat === "vorschlag") { oeffneAuswahl(slot, index, true); return; }
  if (tat === "waehlen") { oeffneAuswahl(slot, index, false); return; }
  if (tat === "leeren") { slotSetzen(slot.schluessel, index, null); return; }
  if (tat === "ansehen") {
    var e = planElement(slot.schluessel, index);
    if (e) zeigeDetail(e);
    return;
  }
  if (tat === "weg") {
    plan.haupt.splice(index, 1);
    if (!plan.haupt.length) plan.haupt.push(null);
    speicherePlan(); zeichnePlan();
    return;
  }
  if (tat === "zufall") {
    var gewaehlt = wuerfleBaustein(slot, zieldauerFuer(slot, index));
    if (gewaehlt) slotSetzen(slot.schluessel, index, gewaehlt.id);
  }
}

/**
 * Zieht einen zufälligen Baustein für einen Platz.
 * `zieldauer` = 0 heißt: egal wie lang. Sonst wird eine Zielspanne gesucht –
 * nur eine Obergrenze würde den Abend zu kurz geraten lassen, weil dann
 * ständig Fünf-Minuten-Spiele gezogen werden.
 */
var gelockert = false;   // merkt sich, ob der Rahmen aufgeweicht werden musste

/** IDs, die bereits im Plan stehen – die sollen nicht doppelt gewürfelt werden. */
function bereitsImPlan() {
  var ids = {};
  var slots = alleSlots();
  for (var i = 0; i < slots.length; i++) {
    var e = planElement(slots[i].slot.schluessel, slots[i].index);
    if (e) ids[e.id] = true;
  }
  return ids;
}

function wuerfleBaustein(slot, zieldauer) {
  var schonDa = bereitsImPlan();
  var moegliche = sammle(rahmenFilter(), null, function (e) {
    return slot.passt(e) && !schonDa[e.id];
  });
  if (!moegliche.length) {
    // Sonst bekäme man kommentarlos ein Draußen-Spiel mit Material,
    // obwohl man "drinnen, ohne Material" eingestellt hat.
    gelockert = true;
    moegliche = sammle(leereFilter(), null, function (e) {
      return slot.passt(e) && !schonDa[e.id];
    });
    if (!moegliche.length) moegliche = sammle(leereFilter(), null, slot.passt);
  }
  if (!moegliche.length) return null;

  var passend = moegliche;
  if (zieldauer) {
    passend = moegliche.filter(function (e) {
      var d = mitteldauer(e);
      return d >= zieldauer * 0.55 && d <= zieldauer * 1.15;
    });
    if (!passend.length) {
      passend = moegliche.filter(function (e) { return mitteldauer(e) <= zieldauer * 1.15; });
    }
    if (!passend.length) {
      passend = moegliche.slice().sort(function (a, b) {
        return mitteldauer(a) - mitteldauer(b);
      }).slice(0, 20);
    }
  }
  return passend[Math.floor(Math.random() * passend.length)];
}

/** Füllt alle leeren Plätze und hält dabei die Zielzeit im Auge. */
function planWuerfeln() {
  gelockert = false;
  // Erst Einstieg und Abschluss – die sollen kurz bleiben
  for (var s = 0; s < SLOTS.length; s++) {
    if (SLOTS[s].mehrfach) continue;
    if (!planElement(SLOTS[s].schluessel, 0)) {
      var kurz = wuerfleBaustein(SLOTS[s], zieldauerFuer(SLOTS[s], 0));
      if (kurz) plan[SLOTS[s].schluessel] = kurz.id;
    }
  }
  // Dann den Hauptteil: die verbleibende Zeit auf die freien Plätze verteilen
  var hauptSlot = null;
  for (var h = 0; h < SLOTS.length; h++) if (SLOTS[h].mehrfach) hauptSlot = SLOTS[h];
  for (var i = 0; i < plan.haupt.length; i++) {
    if (planElement("haupt", i)) continue;
    var gewaehlt = wuerfleBaustein(hauptSlot, zieldauerFuer(hauptSlot, i));
    if (gewaehlt) plan.haupt[i] = gewaehlt.id;
  }
  speicherePlan();
  zeichnePlan();
  if (gelockert) {
    melde("Mit diesem Rahmen gab es zu wenig – die Vorgaben wurden gelockert.");
  }
}

/* --------------------------------------------------------- Gesamtdauer */
function planDauer() {
  var min = KREIS_DAUER * 2, max = KREIS_DAUER * 2;
  var slots = alleSlots();
  for (var i = 0; i < slots.length; i++) {
    var e = planElement(slots[i].slot.schluessel, slots[i].index);
    if (e) { min += e.dauer_min; max += e.dauer_max; }
  }
  return { min: min, max: max, mitte: Math.round((min + max) / 2) };
}

function aktualisiereSumme() {
  var d = planDauer();
  var text = d.min === d.max ? d.min + " Min" : d.min + "–" + d.max + " Min";
  var knapp = d.mitte < rahmen.zielzeit * 0.75 || d.mitte > rahmen.zielzeit * 1.25;
  $("summeWert").textContent = text + "  (Ziel " + rahmen.zielzeit + ")";
  $("summeWert").className = "summe-wert" + (knapp ? " knapp" : "");
  var anteil = Math.max(3, Math.min(100, Math.round(d.mitte / rahmen.zielzeit * 100)));
  $("summeBalken").style.width = anteil + "%";
  $("summeBalken").className = knapp ? "knapp" : "";
}

/* ------------------------------------------------------- Plan als Text */
function planAlsText() {
  var zeilen = ["Heimabend-Plan", "=============="];
  var nummer = 1;
  var material = [];
  zeilen.push(nummer++ + ". Eröffnungskreis (" + KREIS_DAUER + " Min)");

  var slots = alleSlots();
  for (var i = 0; i < slots.length; i++) {
    var slot = slots[i].slot, index = slots[i].index;
    var e = planElement(slot.schluessel, index);
    var name = slot.name + (slot.mehrfach && plan.haupt.length > 1 ? " " + (index + 1) : "");
    if (!e) { zeilen.push(nummer++ + ". " + name + ": — noch offen —"); continue; }
    zeilen.push(nummer++ + ". " + name + ": " + e.titel + " (" + dauerText(e) + ")");
    zeilen.push("   " + e.kurz);
    var q = e.quelle || {};
    zeilen.push("   Quelle: " + (q.name || "?") + " · " + (q.lizenz || "?") +
                (q.url ? " · " + q.url : ""));
    for (var m = 0; m < (e.material || []).length; m++) {
      if (material.indexOf(e.material[m]) === -1) material.push(e.material[m]);
    }
  }
  zeilen.push(nummer++ + ". Schlusskreis (" + KREIS_DAUER + " Min)");

  var d = planDauer();
  zeilen.push("");
  zeilen.push("Gesamtdauer: " + (d.min === d.max ? d.min + " Min" : d.min + "–" + d.max + " Min") +
              "  (Ziel " + rahmen.zielzeit + " Min)");
  zeilen.push("Material: " + (material.length ? material.join(", ") : "keines"));
  zeilen.push("");
  zeilen.push("Zusammengestellt mit dem Heimabend-Baukasten.");
  return zeilen.join("\n");
}

var meldeUhr = null;
function melde(text) {
  $("planMeldung").textContent = text;
  clearTimeout(meldeUhr);   // sonst löscht die ältere Zeitschaltung die neuere Meldung
  meldeUhr = setTimeout(function () { $("planMeldung").textContent = ""; }, 4000);
}
function planTeilen() {
  var text = planAlsText();
  if (navigator.share) {
    navigator.share({ title: "Heimabend-Plan", text: text })
      .catch(function () { inZwischenablage(text); });
    return;
  }
  inZwischenablage(text);
}
function inZwischenablage(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () { melde("Plan kopiert."); },
      function () { markiereText(); });
  } else { markiereText(); }
}
function markiereText() {
  var feld = $("planText");
  feld.focus(); feld.select();
  try { document.execCommand("copy"); melde("Plan kopiert."); }
  catch (fehler) { melde("Text unten ist markiert – jetzt kopieren."); }
}

/* ------------------------------------------------- Plan merken (lokal) */
function speicherePlan() {
  try {
    localStorage.setItem("heimabend-plan", JSON.stringify({ plan: plan, rahmen: rahmen }));
  } catch (fehler) { /* egal */ }
}
function ladePlan() {
  try {
    var roh = localStorage.getItem("heimabend-plan");
    if (!roh) return;
    var gespeichert = JSON.parse(roh);
    if (gespeichert && gespeichert.plan && Array.isArray(gespeichert.plan.haupt)) {
      plan = {
        einstieg: typeof gespeichert.plan.einstieg === "string" ? gespeichert.plan.einstieg : null,
        abschluss: typeof gespeichert.plan.abschluss === "string" ? gespeichert.plan.abschluss : null,
        haupt: gespeichert.plan.haupt.map(function (id) {
          return typeof id === "string" ? id : null;
        })
      };
      if (!plan.haupt.length) plan.haupt = [null, null];
    }
    if (gespeichert && gespeichert.rahmen) {
      var gemerkt = gespeichert.rahmen;
      // Alles prüfen: ein verstellter Wert wie zielzeit 0 oder "abc" führt
      // sonst zu "noch NaN Min frei" und einem Balken, der nie mehr stimmt.
      var zeiten = ["60", "90", "120", "150", "180"];
      var zielzeit = parseInt(gemerkt.zielzeit, 10);
      rahmen = {
        zielzeit: zeiten.indexOf(String(zielzeit)) !== -1 ? zielzeit : 120,
        stufe: ALTERSSTUFEN.indexOf(gemerkt.stufe) !== -1 ? gemerkt.stufe : "",
        teilnehmer: parseInt(gemerkt.teilnehmer, 10) > 0 ? parseInt(gemerkt.teilnehmer, 10) : 0,
        ort: ["drinnen", "draussen"].indexOf(gemerkt.ort) !== -1 ? gemerkt.ort : "",
        vorbereitung: ["gering", "mittel"].indexOf(gemerkt.vorbereitung) !== -1
                      ? gemerkt.vorbereitung : "",
        ohneMaterial: !!gemerkt.ohneMaterial
      };
      $("rZielzeit").value = String(rahmen.zielzeit);
      $("rStufe").value = rahmen.stufe || "";
      $("rTeilnehmer").value = rahmen.teilnehmer ? String(rahmen.teilnehmer) : "";
      $("rOrt").value = rahmen.ort || "";
      $("rVorbereitung").value = rahmen.vorbereitung || "";
      $("rOhneMaterial").checked = !!rahmen.ohneMaterial;
    }
  } catch (fehler) { /* egal */ }
}

/* ------------------------------------------------- Auswahl für Slots */
function oeffneAuswahl(slot, index, nurPassend) {
  var frei = freieZeit({ slot: slot, index: index });
  var ziel = zieldauerFuer(slot, index);
  // Ist der Plan schon voll, wäre "höchstens 0 Minuten" gleichbedeutend mit
  // "kein einziger Baustein". Dann gilt die Zieldauer als Spielraum.
  auswahlZiel = { slot: slot, index: index, frei: frei,
                  spielraum: Math.max(frei, ziel), ziel: ziel };
  auswahlPfad = { typ: "", kategorie: "", unterkategorie: "" };
  var name = slot.name + (slot.mehrfach && plan.haupt.length > 1 ? " " + (index + 1) : "");
  $("auswahlTitel").textContent = name;
  $("auswahlSuche").value = "";
  $("auswahlZeit").checked = !!nurPassend;
  $("auswahlZeitText").textContent = frei > 0
    ? "nur was in die Zeit passt (noch " + Math.round(frei) + " Min frei)"
    : "nur bis ca. " + ziel + " Min (die Zielzeit ist schon voll)";
  auswahlSichtbar = SEITENGROESSE;
  zeichneAuswahl();
  oeffneUeberlagerung($("auswahl"));
}

/** Baut eine Reihe Auswahl-Chips (Art, Kategorie, Unterkategorie). */
function chipReihe(titel, eintraege, aktiv, beiKlick) {
  if (eintraege.length < 2) return "";
  var html = '<div class="chipzeile"><div class="chiptitel">' + schuetze(titel) + "</div>";
  html += '<div class="chips">';
  html += '<button type="button" class="chip' + (aktiv ? "" : " aktiv") +
          '" aria-pressed="' + (aktiv ? "false" : "true") + '" data-wert="">alle</button>';
  for (var i = 0; i < eintraege.length; i++) {
    var gewaehlt = aktiv === eintraege[i].wert;
    html += '<button type="button" class="chip' + (gewaehlt ? " aktiv" : "") +
            '" aria-pressed="' + (gewaehlt ? "true" : "false") +
            '" data-wert="' + schuetze(eintraege[i].wert) + '">' +
            schuetze(eintraege[i].name) + " " + eintraege[i].anzahl + "</button>";
  }
  return html + "</div></div>";
}

function zeichneAuswahl() {
  if (!auswahlZiel) return;
  var f = rahmenFilter();
  f.suche = vereinfache($("auswahlSuche").value.trim());
  var nurPassend = $("auswahlZeit").checked;
  var spielraum = auswahlZiel.spielraum;

  var grundmenge = sammle(f, null, function (e) {
    if (!auswahlZiel.slot.passt(e)) return false;
    if (nurPassend && e.dauer_max > spielraum) return false;
    return true;
  });

  // Chips aus der aktuellen Grundmenge aufbauen
  function zaehleFeld(liste, feld) {
    var zaehler = {};
    for (var i = 0; i < liste.length; i++) {
      var wert = liste[i][feld];
      if (wert) zaehler[wert] = (zaehler[wert] || 0) + 1;
    }
    return zaehler;
  }
  function alsEintraege(zaehler, beschriftung) {
    return Object.keys(zaehler).map(function (k) {
      return { wert: k, name: beschriftung(k), anzahl: zaehler[k] };
    }).sort(function (a, b) { return b.anzahl - a.anzahl; });
  }

  var nachTyp = alsEintraege(zaehleFeld(grundmenge, "element_typ"),
                             function (k) { return TYP_TEXT[k] || k; });
  if (auswahlPfad.typ && !nachTyp.some(function (x) { return x.wert === auswahlPfad.typ; })) {
    auswahlPfad.typ = "";
  }
  var mitTyp = grundmenge.filter(function (e) {
    return !auswahlPfad.typ || e.element_typ === auswahlPfad.typ;
  });
  var nachKategorie = alsEintraege(zaehleFeld(mitTyp, "kategorie"),
                                   function (k) { return KATEGORIE_TEXT[k] || k; });
  if (auswahlPfad.kategorie &&
      !nachKategorie.some(function (x) { return x.wert === auswahlPfad.kategorie; })) {
    auswahlPfad.kategorie = "";
  }
  var mitKategorie = mitTyp.filter(function (e) {
    return !auswahlPfad.kategorie || e.kategorie === auswahlPfad.kategorie;
  });
  var nachUnter = alsEintraege(zaehleFeld(mitKategorie, "unterkategorie"),
                               unterText);
  if (auswahlPfad.unterkategorie &&
      !nachUnter.some(function (x) { return x.wert === auswahlPfad.unterkategorie; })) {
    auswahlPfad.unterkategorie = "";
  }

  var chipHtml = chipReihe("Art", nachTyp, auswahlPfad.typ) +
                 chipReihe("Kategorie", nachKategorie, auswahlPfad.kategorie) +
                 chipReihe("Unterkategorie", nachUnter, auswahlPfad.unterkategorie);
  $("auswahlChips").innerHTML = chipHtml;

  var reihen = $("auswahlChips").querySelectorAll(".chipzeile");
  var felder = [];
  if (nachTyp.length > 1) felder.push("typ");
  if (nachKategorie.length > 1) felder.push("kategorie");
  if (nachUnter.length > 1) felder.push("unterkategorie");
  for (var r = 0; r < reihen.length; r++) {
    (function (feld) {
      var knoepfe = reihen[r].querySelectorAll(".chip");
      for (var c = 0; c < knoepfe.length; c++) {
        knoepfe[c].addEventListener("click", function () {
          auswahlPfad[feld] = this.getAttribute("data-wert");
          // tiefere Ebenen zurücksetzen, sonst passt nichts mehr zusammen
          if (feld === "typ") { auswahlPfad.kategorie = ""; auswahlPfad.unterkategorie = ""; }
          if (feld === "kategorie") auswahlPfad.unterkategorie = "";
          auswahlSichtbar = SEITENGROESSE;
          zeichneAuswahl();
        });
      }
    })(felder[r]);
  }

  auswahlListe = mitKategorie.filter(function (e) {
    return !auswahlPfad.unterkategorie || e.unterkategorie === auswahlPfad.unterkategorie;
  });
  // Beim Vorschlagen zuerst das, was zeitlich am besten passt
  if (nurPassend && !f.suche) {
    var ziel = auswahlZiel.ziel;
    auswahlListe.sort(function (a, b) {
      return Math.abs(mitteldauer(a) - ziel) - Math.abs(mitteldauer(b) - ziel) ||
             nachTitel(a, b);
    });
  } else {
    sortiere(auswahlListe, "dauer", f.suche, rahmen.stufe);
  }

  var behaelter = $("auswahlListe");
  behaelter.innerHTML = "";
  $("auswahlTreffer").textContent = auswahlListe.length === 1
    ? "1 Baustein" : auswahlListe.length + " Bausteine";

  if (!auswahlListe.length) {
    behaelter.innerHTML = '<li><p class="leer">Nichts gefunden. Nimm den Haken bei ' +
      '„nur was in die Zeit passt“ heraus oder lockere den Rahmen des Abends.</p></li>';
    $("auswahlMehrZeile").hidden = true;
    return;
  }
  var stapel = document.createDocumentFragment();
  var bis = Math.min(auswahlSichtbar, auswahlListe.length);
  for (var i = 0; i < bis; i++) {
    stapel.appendChild(baueKarte(auswahlListe[i], function (e) {
      slotSetzen(auswahlZiel.slot.schluessel, auswahlZiel.index, e.id);
      schliesseUeberlagerung($("auswahl"));
    }, nurPassend));
  }
  behaelter.appendChild(stapel);
  $("auswahlMehrZeile").hidden = bis >= auswahlListe.length;
  $("auswahlMehr").textContent = "Weitere anzeigen (" + (auswahlListe.length - bis) + ")";
}

/* ---------------------------------------------------------- Fußzeile */
function zeichneFuss() {
  var quellen = {};
  for (var i = 0; i < ALLE.length; i++) {
    var q = ALLE[i].quelle || {};
    var schluessel = (q.name || "?") + " – " + (q.lizenz || "?");
    quellen[schluessel] = (quellen[schluessel] || 0) + 1;
  }
  var namen = Object.keys(quellen).sort(function (a, b) { return quellen[b] - quellen[a]; });
  var html = "<p><strong>" + ALLE.length + " Bausteine</strong> aus diesen Quellen:</p><p>";
  for (var n = 0; n < namen.length; n++) {
    html += schuetze(namen[n]) + " (" + quellen[namen[n]] + ")<br>";
  }
  html += "</p><p>Jeder Baustein steht unter der Lizenz seiner Quelle; sie wird in der " +
          "Detailansicht genannt. Das Projekt ist nicht-kommerziell.</p>";
  $("fuss").innerHTML = html;
}

/* ------------------------------------------------------------ Ansichten */
function zeigeAnsicht(name) {
  var bausteine = name === "bausteine";
  $("ansichtBausteine").hidden = !bausteine;
  $("ansichtPlanen").hidden = bausteine;
  // aria-current statt der Reiter-Rolle: die App liefert kein Pfeiltasten-
  // Verhalten, das die Rolle "tab" versprechen würde.
  if (bausteine) { $("reiterBausteine").setAttribute("aria-current", "page"); }
  else { $("reiterBausteine").removeAttribute("aria-current"); }
  if (!bausteine) { $("reiterPlanen").setAttribute("aria-current", "page"); }
  else { $("reiterPlanen").removeAttribute("aria-current"); }
  window.scrollTo(0, 0);
  if (!bausteine) zeichnePlan();
}

/* ------------------------------------------------------------ Start */
function liesRahmen() {
  rahmen.zielzeit = parseInt($("rZielzeit").value, 10) || 120;
  rahmen.stufe = $("rStufe").value;
  rahmen.teilnehmer = $("rTeilnehmer").value ? parseInt($("rTeilnehmer").value, 10) : 0;
  rahmen.ort = $("rOrt").value;
  rahmen.vorbereitung = $("rVorbereitung").value;
  rahmen.ohneMaterial = $("rOhneMaterial").checked;
  speicherePlan();
  zeichnePlan();
}

function verdrahte() {
  var entprellen = null;
  $("suche").addEventListener("input", function () {
    clearTimeout(entprellen);
    entprellen = setTimeout(aktualisiere, 150);
  });
  var felder = ["fStufe", "fDauer", "fTeilnehmer", "fOrt", "fVorbereitung",
                "fOhneMaterial", "fMitAlter"];
  for (var i = 0; i < felder.length; i++) {
    $(felder[i]).addEventListener("change", aktualisiere);
  }
  $("sortierung").addEventListener("change", aktualisiere);
  $("filterZuruecksetzen").addEventListener("click", setzeFilterZurueck);
  $("mehrKnopf").addEventListener("click", function () {
    sichtbar += SEITENGROESSE; zeichneListe(filterWerte());
  });
  $("zufallKnopf").addEventListener("click", function () {
    var menge = gefiltert.length ? gefiltert : sammle(filterWerte(), pfad);
    if (menge.length) zeigeDetail(menge[Math.floor(Math.random() * menge.length)]);
  });

  $("reiterBausteine").addEventListener("click", function () { zeigeAnsicht("bausteine"); });
  $("reiterPlanen").addEventListener("click", function () { zeigeAnsicht("planen"); });

  $("detailZurueck").addEventListener("click", function () {
    schliesseUeberlagerung($("detail"));
  });
  $("auswahlZurueck").addEventListener("click", function () {
    schliesseUeberlagerung($("auswahl"));
  });
  document.addEventListener("keydown", function (ereignis) {
    if (ereignis.key !== "Escape") return;
    if (!$("detail").hidden) schliesseUeberlagerung($("detail"));
    else if (!$("auswahl").hidden) schliesseUeberlagerung($("auswahl"));
  });

  var auswahlEntprellen = null;
  $("auswahlSuche").addEventListener("input", function () {
    clearTimeout(auswahlEntprellen);
    auswahlEntprellen = setTimeout(function () {
      auswahlSichtbar = SEITENGROESSE; zeichneAuswahl();
    }, 150);
  });
  $("auswahlZeit").addEventListener("change", function () {
    auswahlSichtbar = SEITENGROESSE; zeichneAuswahl();
  });
  $("auswahlMehr").addEventListener("click", function () {
    auswahlSichtbar += SEITENGROESSE; zeichneAuswahl();
  });

  var rahmenFelder = ["rZielzeit", "rStufe", "rTeilnehmer", "rOrt", "rVorbereitung",
                      "rOhneMaterial"];
  for (var r = 0; r < rahmenFelder.length; r++) {
    $(rahmenFelder[r]).addEventListener("change", liesRahmen);
  }
  $("planWuerfeln").addEventListener("click", planWuerfeln);
  $("planLeeren").addEventListener("click", function () {
    plan = { einstieg: null, haupt: [null, null], abschluss: null };
    speicherePlan(); zeichnePlan();
  });
  $("planKopieren").addEventListener("click", planTeilen);
}

function starte(elemente) {
  ALLE = elemente;
  for (var i = 0; i < ALLE.length; i++) {
    var e = ALLE[i];
    NACH_ID[e.id] = e;
    if (typeof e.unterkategorie !== "string") e.unterkategorie = "";
    // Suchtext einmal vorbereiten – dann ist die Suche auch am Handy flüssig
    e._titeltext = vereinfache(e.titel);
    e._kopftext = vereinfache([e.kurz, (e.tags || []).join(" "),
                               (e.themen || []).join(" "), kategorieText(e),
                               unterText(e.unterkategorie)].join(" "));
    e._suchtext = vereinfache([
      e.titel, e.kurz, (e.tags || []).join(" "), (e.themen || []).join(" "),
      kategorieText(e), unterText(e.unterkategorie), e.beschreibung
    ].join(" "));
  }
  verdrahte();
  ladePlan();
  aktualisiere();
  zeichneFuss();
}

ladeDaten().then(starte).catch(function (fehler) {
  $("kacheln").innerHTML = '<p class="leer" style="grid-column:1/-1">' +
    "Die Daten konnten nicht geladen werden.<br><br>" +
    "Erwartet wird <code>../data/elemente.json</code> oder <code>elemente.js</code> " +
    "neben dieser Datei.<br>Beides erzeugt <code>python3 scripts/build.py</code>." +
    "<br><br><small>" + schuetze(fehler.message) + "</small></p>";
});
